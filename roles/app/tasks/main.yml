---
- name: Create dedicated service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dest }}"
    version: "{{ app_version }}"
  become: true
  notify: Restart app

- name: Template environment file (contains DB credentials)
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dest }}/.env"
    owner: "{{ app_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart app

- name: Install systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/demo-app.service
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart app

- name: Ensure app is enabled and running
  ansible.builtin.systemd:
    name: demo-app
    state: started
    enabled: true
  become: true

- name: Wait for app to report healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/healthz"
    status_code: 200
  register: app_health
  retries: 5
  delay: 3
  until: app_health.status == 200
