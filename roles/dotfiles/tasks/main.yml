---
- name: Clone dotfiles repo
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: "{{ dotfiles_version | default('main') }}"
    update: true

- name: Symlink dotfiles into home directory
  ansible.builtin.file:
    src: "{{ dotfiles_dest }}/{{ item }}"
    dest: "{{ ansible_env.HOME }}/{{ item }}"
    state: link
    force: true
  loop: "{{ dotfiles_files }}"
